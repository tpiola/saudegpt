name: Update Homepage UI
on:
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write new page.tsx
        run: python3 infrastructure/scripts/write-page.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git diff --staged --quiet || git commit -m "feat: UI premium homepage - hero, trilhas, pilares, CTA"
          git push
