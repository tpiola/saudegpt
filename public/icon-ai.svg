<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020e0c"/>
      <stop offset="100%" stop-color="#0d3a32"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <!-- Head outline -->
  <ellipse cx="50" cy="48" rx="22" ry="24" fill="none" stroke="url(#glow)" stroke-width="2.5" filter="url(#neon)"/>
  <!-- Eyes -->
  <ellipse cx="40" cy="44" rx="4.5" ry="5" fill="#10b981" opacity="0.9"/>
  <ellipse cx="60" cy="44" rx="4.5" ry="5" fill="#10b981" opacity="0.9"/>
  <!-- Eye pupils -->
  <circle cx="41" cy="43" r="2" fill="#020e0c"/>
  <circle cx="61" cy="43" r="2" fill="#020e0c"/>
  <!-- Smile -->
  <path d="M 40 56 Q 50 64 60 56" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" filter="url(#neon)"/>
  <!-- Antenna -->
  <line x1="50" y1="24" x2="50" y2="14" stroke="url(#glow)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="12" r="3.5" fill="#10b981" opacity="0.8"/>
  <!-- Network dots -->
  <circle cx="50" cy="12" r="1.5" fill="#10b981" opacity="0.4">
    <animate attributeName="r" values="1.5;3;1.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Cross pulse -->
  <g opacity="0.15">
    <path d="M 50 88 v-6 M 47 85 h6" stroke="#10b981" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
