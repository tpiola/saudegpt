<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Mapa de estudo: Sistema Nervoso: Dor, Emoções e Medicamentos"><title>Sistema Nervoso: Dor, Emoções e Medicamentos</title><rect width="1280" height="640" fill="#f0f4e8"/><g font-family="Arial, sans-serif"><text x="40" y="48" fill="#27734f" font-size="14" letter-spacing="2">SAÚDEGPT · MAPA DE ESTUDO</text><text x="40" y="100" font-size="31" fill="#123e36">Sistema Nervoso: Dor, Emoções e Medicamentos</text><rect x="40" y="215" width="380" height="345" rx="20" fill="#ffffff"/><circle cx="78" cy="258" r="18" fill="#e8efe1"/><text x="73" y="264" font-size="16" fill="#123e36">1</text><text x="64" y="310" font-size="14" letter-spacing="2" fill="#27734f">ENTENDER</text><text x="64" y="354" font-size="17" fill="#123e36">O sistema nervoso divide-se em</text><text x="64" y="377.8" font-size="17" fill="#123e36">central (SNC: cérebro e medula) e</text><text x="64" y="401.6" font-size="17" fill="#123e36">periférico (SNP: nervos pelo</text><text x="64" y="425.4" font-size="17" fill="#123e36">corpo).</text><rect x="440" y="215" width="380" height="345" rx="20" fill="#ffffff"/><circle cx="478" cy="258" r="18" fill="#e8efe1"/><text x="473" y="264" font-size="16" fill="#123e36">2</text><text x="464" y="310" font-size="14" letter-spacing="2" fill="#27734f">APLICAR</text><text x="464" y="354" font-size="17" fill="#123e36">Perguntar sobre tipo, localização</text><text x="464" y="377.8" font-size="17" fill="#123e36">e duração da dor.</text><rect x="840" y="215" width="380" height="345" rx="20" fill="#123e36"/><circle cx="878" cy="258" r="18" fill="#dce9c5"/><text x="873" y="264" font-size="16" fill="#123e36">3</text><text x="864" y="310" font-size="14" letter-spacing="2" fill="#dce9c5">PEDIR APOIO</text><text x="864" y="354" font-size="17" fill="#ffffff">Dor que não melhora com</text><text x="864" y="377.8" font-size="17" fill="#ffffff">analgésicos comuns (suspeita de</text><text x="864" y="401.6" font-size="17" fill="#ffffff">dor neuropática).</text><text x="40" y="607" fill="#52665f" font-size="12">Fundamentos da Farmácia · Anatomia e Fisiologia Humana</text></g></svg>