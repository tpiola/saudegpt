377.8" font-size="17" fill="#ffffff">indisponível depende de avaliação</text><text x="864" y="401.6" font-size="17" fill="#ffffff">técnica.</text><text x="40" y="607" fill="#52665f" font-size="12">Cuidado Humanizado e Atendimento que Encanta · Comunicação que Acolhe e Cura — com o Perfil 51%</text></g></svg>