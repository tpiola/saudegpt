<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Mapa de estudo: Tipos de Farmácia e Seus Segmentos"><title>Tipos de Farmácia e Seus Segmentos</title><rect width="1280" height="640" fill="#f0f4e8"/><g font-family="Arial, sans-serif"><text x="40" y="48" fill="#27734f" font-size="14" letter-spacing="2">SAÚDEGPT · MAPA DE ESTUDO</text><text x="40" y="100" font-size="31" fill="#123e36">Tipos de Farmácia e Seus Segmentos</text><rect x="40" y="215" width="380" height="345" rx="20" fill="#ffffff"/><circle cx="78" cy="258" r="18" fill="#e8efe1"/><text x="73" y="264" font-size="16" fill="#123e36">1</text><text x="64" y="310" font-size="14" letter-spacing="2" fill="#27734f">ENTENDER</text><text x="64" y="354" font-size="17" fill="#123e36">Farmácia comercial/drogaria vende</text><text x="64" y="377.8" font-size="17" fill="#123e36">medicamentos industrializados,</text><text x="64" y="401.6" font-size="17" fill="#123e36">perfumaria e correlatos; é o</text><text x="64" y="425.4" font-size="17" fill="#123e36">modelo mais comum.</text><rect x="440" y="215" width="380" height="345" rx="20" fill="#ffffff"/><circle cx="478" cy="258" r="18" fill="#e8efe1"/><text x="473" y="264" font-size="16" fill="#123e36">2</text><text x="464" y="310" font-size="14" letter-spacing="2" fill="#27734f">APLICAR</text><text x="464" y="354" font-size="17" fill="#123e36">Saber o tipo de farmácia onde</text><text x="464" y="377.8" font-size="17" fill="#123e36">trabalha (drogaria, manipulação,</text><text x="464" y="401.6" font-size="17" fill="#123e36">etc.).</text><rect x="840" y="215" width="380" height="345" rx="20" fill="#123e36"/><circle cx="878" cy="258" r="18" fill="#dce9c5"/><text x="873" y="264" font-size="16" fill="#123e36">3</text><text x="864" y="310" font-size="14" letter-spacing="2" fill="#dce9c5">PEDIR APOIO</text><text x="864" y="354" font-size="17" fill="#ffffff">Cliente pergunta sobre fórmula</text><text x="864" y="377.8" font-size="17" fill="#ffffff">manipulada específica que a</text><text x="864" y="401.6" font-size="17" fill="#ffffff">farmácia não tem.</text><text x="40" y="607" fill="#52665f" font-size="12">Fundamentos da Farmácia · História da Profissão Farmacêutica</text></g></svg>